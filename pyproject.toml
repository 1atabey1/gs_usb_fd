[project]
name = "python-can-gs-usb-fd"
version = "0.2.0"
description = "python-can interface for CAN FD over gs_usb devices (tricore-debug-machine probe, candleLight FD)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "python-can>=4.6.0",
    "pyusb>=1.3.1",
    "libusb-package>=1.0.26",
]

[project.urls]
homepage = "https://github.com/1atabey1/gs_usb_fd"
repository = "https://github.com/1atabey1/gs_usb_fd"

[project.optional-dependencies]
test = ["pytest>=8.0"]

# Registers the interface with python-can: can.Bus(interface="gs_usb_fd", ...)
[project.entry-points."can.interface"]
gs_usb_fd = "python_can_gs_usb_fd.bus:GsUsbFdBus"

[project.scripts]
gs-usb-fd = "python_can_gs_usb_fd.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs a probe on USB (set GS_USB_FD_HW=1)"]
